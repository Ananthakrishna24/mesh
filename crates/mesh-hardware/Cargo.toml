[package]
name = "mesh-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CPU, memory, CUDA, and Metal discovery"

[features]
default = ["cuda"]
cuda = ["dep:nvml-wrapper"]
metal = ["dep:objc2-metal"]

[dependencies]
mesh-core = { workspace = true }
sysinfo = "0.39.6"
nvml-wrapper = { version = "0.12.1", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
