syntax = "proto3";
package mesh.v1;

message ControlEnvelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes message_id = 3;
  bytes sender_node_id = 4;
  optional bytes in_reply_to = 5;

  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    PeerUpdate peer_update = 12;
    Heartbeat heartbeat = 13;
    ErrorMessage error = 14;
    CapabilityReport capability_report = 15;
    BenchmarkRequest benchmark_request = 16;
    BenchmarkAccept benchmark_accept = 17;
    BenchmarkReject benchmark_reject = 18;
    BenchmarkResult benchmark_result = 19;

    ResourceQuery resource_query = 20;
    ResourceOffer resource_offer = 21;
    ReserveRequest reserve_request = 22;
    ReserveAccepted reserve_accepted = 23;
    ReserveRejected reserve_rejected = 24;
    ReservationCommit reservation_commit = 25;
    ReservationRelease reservation_release = 26;

    ModelPrepare model_prepare = 30;
    ModelProgress model_progress = 31;
    ModelReady model_ready = 32;
    ModelFailed model_failed = 33;

    InferenceRequest inference_request = 40;
    TokenResult token_result = 41;
    CancelRequest cancel_request = 42;

    IntroductionOffer introduction_offer = 50;
    IntroductionReady introduction_ready = 51;
    PeerObserve peer_observe = 52;
  }
}

message Hello {
  bytes mesh_id = 1;
  uint32 minimum_protocol_minor = 2;
  string display_name = 3;
  optional bytes enrollment_id = 4;
  optional bytes enrollment_secret = 5;
  bytes capability_digest = 6;
  repeated EndpointCandidate candidates = 7;
}

message Welcome {
  uint32 selected_protocol_minor = 1;
  PeerRecord responder = 2;
  repeated PeerRecord known_peers = 3;
}

message PeerUpdate {
  repeated PeerRecord peers = 1;
}

message Heartbeat {
  int64 sent_at_unix_ms = 1;
}

message ErrorMessage {
  ErrorCode code = 1;
  optional bytes related_message_id = 2;
  bool retriable = 3;
  string summary = 4;
  string detail = 5;
  optional bytes deployment_id = 6;
  optional bytes request_id = 7;
  optional uint64 transfer_id = 8;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  MALFORMED_FRAME = 1;
  UNSUPPORTED_PROTOCOL = 2;
  IDENTITY_MISMATCH = 3;
  MESH_MISMATCH = 4;
  INVITE_INVALID = 5;
  INVITE_EXPIRED = 6;
  INVITE_ALREADY_USED = 7;
  UNKNOWN_PEER = 8;
  INVALID_STATE = 9;
  RESOURCE_BUSY = 10;
  RESERVATION_REJECTED = 11;
  MODEL_PREPARATION_FAILED = 12;
  REQUEST_REJECTED = 13;
  TRANSFER_REJECTED = 14;
  CANCELLED = 15;
  INTERNAL = 16;
}

message PeerRecord {
  bytes node_id = 1;
  string display_name = 2;
  bytes certificate_der = 3;
  repeated EndpointCandidate candidates = 4;
}

message EndpointCandidate {
  CandidateKind kind = 1;
  string address = 2;
  uint32 priority = 3;
}

enum CandidateKind {
  CANDIDATE_KIND_UNSPECIFIED = 0;
  GLOBAL_IPV6 = 1;
  PUBLIC_IPV4 = 2;
  ROUTER_MAPPING = 3;
  MANUAL = 4;
  PEER_OBSERVED = 5;
  LOCAL_NETWORK = 6;
}

message EnrollmentInviteV1 {
  uint32 format_version = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor_min = 3;
  uint32 protocol_minor_max = 4;
  bytes mesh_id = 5;
  bytes inviter_node_id = 6;
  string inviter_name = 7;
  bytes enrollment_id = 8;
  bytes enrollment_secret = 9;
  int64 expires_at_unix_ms = 10;
  repeated EndpointCandidate candidates = 11;
}

message CapabilityReport {
  int64 collected_at_unix_ms = 1;
  string os = 2;
  string arch = 3;
  string cpu_model = 4;
  uint32 cpu_logical_cores = 5;
  uint64 memory_total_bytes = 6;
  uint64 memory_available_bytes = 7;
  uint64 disk_total_bytes = 8;
  uint64 disk_available_bytes = 9;
  repeated GpuDevice gpus = 10;
  double cpu_fp32_gflops = 11;
  int64 compute_measured_at_unix_ms = 12;
  string status = 13;
}

message GpuDevice {
  GpuBackend backend = 1;
  string stable_id = 2;
  string name = 3;
  uint64 total_memory_bytes = 4;
  optional uint64 available_memory_bytes = 5;
  optional string driver_version = 6;
  optional string runtime_version = 7;
}

enum GpuBackend {
  GPU_BACKEND_UNSPECIFIED = 0;
  CUDA = 1;
  METAL = 2;
}

message BenchmarkRequest {
  bytes probe_id = 1;
  BenchmarkKind kind = 2;
  BenchmarkDirection direction = 3;
  uint64 payload_bytes = 4;
}

message BenchmarkAccept {
  bytes probe_id = 1;
}

message BenchmarkReject {
  bytes probe_id = 1;
  string reason = 2;
}

message BenchmarkResult {
  bytes probe_id = 1;
  BenchmarkKind kind = 2;
  BenchmarkDirection direction = 3;
  double one_way_delay_ms = 4;
  double rtt_ms = 5;
  double rtt_p95_ms = 6;
  uint32 stability_score = 7;
  uint32 sample_count = 8;
  uint32 loss_count = 9;
  uint64 bandwidth_bps = 10;
  uint64 payload_bytes = 11;
  double transfer_ms = 12;
  int64 measured_at_unix_ms = 13;
}

enum BenchmarkKind {
  BENCHMARK_KIND_UNSPECIFIED = 0;
  DELAY = 1;
  BANDWIDTH = 2;
}

enum BenchmarkDirection {
  BENCHMARK_DIRECTION_UNSPECIFIED = 0;
  TO_PEER = 1;
  FROM_PEER = 2;
}

message ResourceAmount {
  uint64 system_memory_bytes = 1;
  uint64 disk_bytes = 2;
  uint32 execution_slots = 3;
  repeated GpuResourceAmount gpus = 4;
}

message GpuResourceAmount {
  string device_stable_id = 1;
  uint64 memory_bytes = 2;
}

message ResourceQuery {
  bytes deployment_id = 1;
  ResourceAmount requested = 2;
}

message ResourceOffer {
  bytes deployment_id = 1;
  ResourceAmount available = 2;
  ResourceAmount offered = 3;
  bool can_satisfy = 4;
  int64 offer_expires_at_unix_ms = 5;
}

message ReserveRequest {
  bytes deployment_id = 1;
  bytes reservation_id = 2;
  ResourceAmount amount = 3;
  uint64 lease_duration_ms = 4;
  string purpose = 5;
}

message ReserveAccepted {
  bytes deployment_id = 1;
  bytes reservation_id = 2;
  ResourceAmount reserved = 3;
  int64 expires_at_unix_ms = 4;
}

message ReserveRejected {
  bytes deployment_id = 1;
  bytes reservation_id = 2;
  string reason = 3;
  ResourceAmount available = 4;
}

message ReservationCommit {
  bytes deployment_id = 1;
  bytes reservation_id = 2;
  uint64 lease_duration_ms = 3;
}

message ReservationRelease {
  bytes deployment_id = 1;
  bytes reservation_id = 2;
  string reason = 3;
}

message IntroductionOffer {
  bytes target_node_id = 1;
  bytes attempt_id = 2;
  int64 start_at_unix_ms = 3;
  string observed_address = 4;
}

message IntroductionReady {
  bytes attempt_id = 1;
  bytes peer_node_id = 2;
  string peer_observed_address = 3;
  string self_observed_address = 4;
  int64 start_at_unix_ms = 5;
}

message PeerObserve {
  bytes observed_node_id = 1;
  string address = 2;
  int64 observed_at_unix_ms = 3;
}

message ModelPrepare {
  bytes deployment_id = 1;
  string assignment_hash = 2;
}

message ModelProgress {
  bytes deployment_id = 1;
  string artifact_path = 2;
  uint64 bytes_done = 3;
  optional uint64 bytes_total = 4;
  string phase = 5;
}

message ModelReady {
  bytes deployment_id = 1;
  string manifest_hash = 2;
  string tokenizer_hash = 3;
}

message ModelFailed {
  bytes deployment_id = 1;
  string reason = 2;
}

message InferenceRequest {
  bytes deployment_id = 1;
  bytes request_id = 2;
  repeated uint32 input_token_ids = 3;
  uint32 max_new_tokens = 4;
  float temperature = 5;
  uint32 top_k = 6;
  float top_p = 7;
  float repetition_penalty = 8;
  float presence_penalty = 9;
  float frequency_penalty = 10;
  uint64 seed = 11;
  repeated uint32 stop_token_ids = 12;
  bool return_logprobs = 13;
}

message TokenResult {
  bytes deployment_id = 1;
  bytes request_id = 2;
  uint32 token_id = 3;
  uint32 token_index = 4;
  bool is_last = 5;
  optional string stop_reason = 6;
  uint32 sequence_length = 7;
}

message CancelRequest {
  bytes deployment_id = 1;
  bytes request_id = 2;
  string reason = 3;
}
