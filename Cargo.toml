[workspace]
resolver = "2"
members = [
    "apps/mesh-app",
    "crates/mesh-core",
    "crates/mesh-store",
    "crates/mesh-net",
    "crates/mesh-hardware",
    "crates/mesh-model",
    "crates/mesh-compute",
    "crates/mesh-inference",
    "crates/mesh-node",
]
default-members = ["apps/mesh-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/local/mesh"
rust-version = "1.88"

[workspace.dependencies]
mesh-core = { path = "crates/mesh-core" }
mesh-store = { path = "crates/mesh-store" }
mesh-net = { path = "crates/mesh-net" }
mesh-hardware = { path = "crates/mesh-hardware" }
mesh-model = { path = "crates/mesh-model" }
mesh-compute = { path = "crates/mesh-compute" }
mesh-inference = { path = "crates/mesh-inference" }
mesh-node = { path = "crates/mesh-node" }

base64 = "0.22.1"
bytes = "1.10.1"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36.1"
hex = "0.4.3"
prost = "0.14.1"
prost-build = "0.14.1"
quinn = { version = "0.11.11", default-features = false, features = [
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-ring",
] }
rand = "0.9.2"
rcgen = "0.14.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.28", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.15", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
igd-next = { version = "0.17.1", default-features = false, features = ["aio_tokio"] }
crab_nat = "0.8.1"
keyring = { version = "3.6.3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
hf-hub = { version = "0.4.3", default-features = false, features = [
    "tokio",
    "rustls-tls",
] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
futures-util = "0.3.31"
tokio-stream = "0.1.17"
tokenizers = { version = "0.21.4", default-features = false, features = ["onig"] }
rand_chacha = "0.9.0"
safetensors = "0.4.5"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
half = "2.6.0"


