[package]
name = "mesh-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native eframe desktop application"
default-run = "mesh"

[[bin]]
name = "mesh"
path = "src/main.rs"

[features]
default = []
cuda = ["mesh-node/cuda"]
metal = ["mesh-node/metal"]

[dependencies]
mesh-core = { workspace = true }
mesh-node = { workspace = true }
mesh-store = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
